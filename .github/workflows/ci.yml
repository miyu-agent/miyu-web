# 三平台 CI（设计 32 第五节，照核心仓库的那一份）：格式、clippy、文档、测试、行数；网页的纯逻辑测试、演示的桥只在 Linux
# 上跑。核心照 Cargo.toml 里 git 依赖钉住的那个提交取，测试读的出厂资源也在那份检出里。
name: CI

on:
  push:
    branches: [main, "step/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: 装上 rust-toolchain.toml 钉住的工具链
        run: rustup toolchain install
      - name: 取编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          add-rust-environment-hash-key: false
          workspaces: |
            .
            web-demo/bridge
      - name: 格式
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: 文档
        run: cargo doc --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: 测试
        run: cargo test --locked --no-fail-fast
      - name: 行数（每个 .rs 不超过 500 行，测试也算）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          over=$(find crates xtask web-demo/bridge/src -name '*.rs' -print0 | xargs -0 wc -l | awk '$2 != "total" && $1 > 500 {print}')
          if [ -n "$over" ]; then echo "超过 500 行：" && echo "$over" && exit 1; fi
      # 许可证（2026-10-30 发布前的审查第 9 条，照 miyu-im 的门禁搬的）：四个平台上用得到的第三方依赖都能和 AGPL-3.0-or-later 合在一起发。
      - name: 许可证
        if: runner.os == 'Linux'
        run: cargo xtask licenses
      # 网页的纯逻辑测试读核心的出厂资源（给人看的字）：照钉住的那份核心检出找（cargo 取 git 依赖时检出的整个仓库）。
      - name: 网页的纯逻辑测试
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node --version
          manifest=$(cargo metadata --format-version 1 --locked | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).packages.find(p=>p.name==="miyu-client");console.log(p.manifest_path)})')
          MIYU_RESOURCES="$(dirname "$manifest")/../../resources" node --test 'web-demo/tests/**/*.test.js'
      - name: 演示的桥
        if: runner.os == 'Linux'
        run: |
          cargo clippy --manifest-path web-demo/bridge/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path web-demo/bridge/Cargo.toml --locked
