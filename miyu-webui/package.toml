# 网页界面的软件包清单（施工 9-1 上，docs/blueprint/packages.md）。给人看的字，不发给模型。

[package]
protocol = [1, 1]
# 包编号是文件夹名 miyu-webui（核心设计 48）；配置键照旧 web.*
prefix = "web"
name = { en = "Web interface", zh = "网页界面", ja = "ウェブ画面" }
summary = { en = "Chat with the AI and change settings in the browser", zh = "在浏览器里和 AI 对话、改配置", ja = "ブラウザで会話し、設定を変える" }

[command]
name = "web"
program = "miyu-web"
# 核心转交时放在人敲的参数前面：miyu web --print 就是 miyu-web open --print（核心 CL-7 起 miyu web 是这个包的命令）
args = ["open"]
about = { en = "Open the web interface", zh = "打开网页界面", ja = "ウェブ画面を開く" }

[ui]
pages_dir = "pages"

[settings.port]
type = "int"
min = 1
max = 65535
default = 8300
layers = ["system"]
name = { en = "Port", zh = "端口", ja = "ポート" }
description = { en = "The port the web interface listens on, for this computer and the local network alike.", zh = "网页界面听的端口，本机和局域网打开都用它。", ja = "ウェブ画面が待ち受けるポート。このコンピューターからもローカルネットワークからも使います。" }

[settings.listen]
type = "text"
max = 64
default = "127.0.0.1"
layers = ["system"]
name = { en = "Listen address", zh = "监听地址", ja = "待ち受けるアドレス" }
description = { en = "0.0.0.0 is every address of this computer; or write just one of them. 127.0.0.1 is this computer only.", zh = "0.0.0.0 是这台电脑的所有地址，也可以只写其中一个；127.0.0.1 只有这台电脑能开。", ja = "0.0.0.0 はこのコンピューターのすべてのアドレス。一つだけ書くこともできます。127.0.0.1 はこのコンピューターだけ。" }

[settings.idle_seconds]
type = "int"
min = 0
max = 86400
default = 600
layers = ["system"]
hidden = true
name = { en = "Idle seconds", zh = "空闲多久退出（秒）", ja = "待機して終了するまで（秒）" }
description = { en = "Quit after this many seconds with no browser connected and no media being served; 0 never quits (for a server where a service manager starts it).", zh = "没有浏览器连着、没有媒体在给，连续这么多秒就退出；0 是不退（服务器上由服务管理器起的）。", ja = "ブラウザがつながっておらずメディアも送っていない状態がこの秒数続いたら終了します。0 は終了しません（サーバーでサービスマネージャーが起動する場合）。" }

[settings.ticket_idle_seconds]
type = "int"
min = 1
max = 2592000
default = 43200
layers = ["system"]
hidden = true
name = { en = "Media ticket idle seconds", zh = "媒体票据多久作废（秒）", ja = "メディアチケットの有効期限（秒）" }
description = { en = "A /media ticket unused for this many seconds stops working.", zh = "/media 的票据这么多秒没用过就作废。", ja = "/media のチケットはこの秒数使われないと無効になります。" }

[settings.most_tickets]
type = "int"
min = 1
max = 1000000
default = 4096
layers = ["system"]
hidden = true
name = { en = "Most media tickets", zh = "最多几张媒体票据", ja = "メディアチケットの上限" }
description = { en = "At most this many /media tickets; the one unused longest goes first.", zh = "/media 的票据最多几张，满了丢最久没用的。", ja = "/media のチケットの上限。いっぱいになると一番長く使われていないものから捨てます。" }
