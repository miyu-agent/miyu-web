[package]
name = "miyu-web-bridge"
version = "0.0.1"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "网页演示的桥：给页面文件，把浏览器的 WebSocket 转到核心的本机套接字上。顶替核心里还没有的网页模块（设计 21 X5、04 P5）。"

[dependencies]
# 连核心：和 miyu ask、TUI 演示同一套（找数据根、拉起核心、本机令牌、会话日志）。
# 核心只经门面 miyu-client 用（设计 32 第二节），照 git 依赖钉住核心的一个提交，和仓库根的 Cargo.toml 钉同一个。
miyu-client = { git = "https://github.com/miyu-agent/miyu", rev = "9573fc54549fa34886c607236d9d0a30a498eb7b" }
# 协议是 JSON-RPC：握手要往里塞本机令牌，`events.read` 要自己回。
serde_json = "1"
# 异步：一个浏览器标签页一条核心连接，互不等。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "fs", "time", "process"] }
# 浏览器那头说 WebSocket（04 P2：浏览器、远程用 WebSocket，每帧一条消息）。MIT。
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 访问口令：32 个随机字节，取系统的随机数（和本机令牌同一个库）。
getrandom = { version = "0.4", features = ["std"] }
# 主题「跟随壁纸」读桌面壁纸：这个仓库的 crate，只用标准库。
miyu-wallpaper = { path = "../../crates/miyu-wallpaper" }
# 核心的 `fs.read`、`blob.get` 回的一段是 base64（`/file`、`/blob` 照它一块块写给浏览器）。和仓库里的同一个版本。MIT 或 Apache-2.0。
base64 = "0.22"

# 开发版也把依赖编成优化的：给壁纸算候选色要解图，不优化的慢五十倍（14 MB 的 JPG 11.7 秒对 0.22 秒），换了壁纸页面要等十几秒、等不及刷新
# 就断了（2026-10-15 项目主人验收 W-163）。只管依赖，桥自己的代码照旧不优化、编得快。
[profile.dev.package."*"]
opt-level = 3

# 和仓库工作区的 lints 一样（根目录 Cargo.toml），演示程序也照这套规矩。
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# 演示程序不进仓库的 workspace，自己单独编，门禁不查它。
[workspace]
